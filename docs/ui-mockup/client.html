<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerius Wealth Management - Secure Mobile Session</title>
    <link rel="stylesheet" href="client.css">
</head>
<body>

    <header>
        <div class="logo">[V] VALERIUS</div>
        <div class="security-badge">🔒 SECURE S2S</div>
    </header>

    <main>
        <div class="client-info">
            <h1>Alexander Vance</h1>
            <p>Private Wealth Smart Onboarding</p>
        </div>

        
            <div class="status-dot"></div>
            <div>Vodafone UK Mobile Trust Verified (+44 7700 900077)</div>
        </div>

        <div class="call-matrix">
            <div class="avatar-box">
                <div class="avatar active" id="aiAvatar">🤖</div>
                <div class="state-label">Digital Partner: <span id="aiState">Speaking...</span></div>
            </div>

            <div class="matrix-connector"></div>

            <div class="avatar-box">
                <div class="avatar" id="humanAvatar">👔</div>
                <div class="state-label">Lead Adviser: <span id="humanState">Listening...</span></div>
            </div>

            <div class="audio-wave">
                <div class="audio-wave-fill" id="audioIndicator"></div>
            </div>
        </div>

        <div class="upload-zone">
            <button class="upload-btn">📷 Upload Identity / Trust Documents</button>
            <input type="file" id="docCapture" class="upload-input" accept="image/*" capture="environment">
        </div>
    </main>

    <footer>
        <button class="btn btn-danger" id="endCallBtn">End</button>
        <button class="btn btn-secondary" id="requestHumanBtn">Speak to Human</button>
    </footer>

</body>
</html>
